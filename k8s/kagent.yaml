apiVersion: v1
kind: Secret
metadata:
  name: alert-triage-agent-secrets
  namespace: kagent
type: Opaque
stringData:
  LLM_API_KEY: "<your-api-key>"
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: alert-triage-agent
  namespace: kagent
spec:
  description: >
    AI-powered alert triage agent that ingests JSON alerts from AWS sources
    (CloudWatch, SNS, EventBridge), labels them with source, event type,
    priority, and environment, then forwards enriched messages to an RCA
    agent via A2A protocol.
  type: BYO
  byo:
    deployment:
      image: alert-triage-agent:latest
      env:
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: alert-triage-agent-secrets
              key: LLM_API_KEY
        - name: LLM_PROVIDER
          value: "openai"
        - name: LLM_MODEL
          value: "gpt-4o-mini"
        - name: RCA_AGENT_URL
          value: "http://rca-agent:8080"
        - name: OTEL_TRACING_ENABLED
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger-collector.jaeger.svc.cluster.local:4317"
